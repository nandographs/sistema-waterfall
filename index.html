<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover libera as env(safe-area-inset-*) usadas pela barra
         inferior de navegação; sem ele o iPhone ignora as variáveis. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sistema Waterfall</title>
    <!-- O arquivo mora em public/ e não na raiz: só o conteúdo de public/ é
         copiado para dist/ no build. Na raiz ele funcionaria no `npm run dev` e
         sumiria em produção — o tipo de erro que ninguém vê até publicar. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter é o substituto que a própria referência indica para a SF Pro.
         Em Mac, iPhone e iPad a SF Pro nativa vem antes na pilha da fonte e o
         Inter nem chega a ser usado — ver --font-sans em src/index.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      THESIS: a operação aparece como uma galeria branca; o dado é o objeto exposto e a interface se cala em volta dele.
      OWN-WORLD: Gallery White sobre Studio Mist, tinta Ink, SF Pro com Inter de substituto, Pricing Blue só em pílula de ação.
      STORY: o operador lê em tipografia o que exige atenção, age numa pílula azul e confirma o efeito sem ruído de chrome.
      FIRST VIEWPORT: saudação em tipo de display, o dia e as ações; as métricas apoiam em cards brancos de 28px.
      FORM: página de produto da Apple — referência em docs/referencia-apple/DESIGN.md, seed waterfall-white-gallery.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <script>
      // Aplica o tema salvo antes do React montar, para não piscar claro→escuro.
      // O padrão é claro: a galeria branca é o desenho; o escuro é opt-in.
      try {
        var t = localStorage.getItem('waterfall:tema');
        document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
